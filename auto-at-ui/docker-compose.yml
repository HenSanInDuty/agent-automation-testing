services:
  control-plane:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      APP_NAME: ${APP_NAME:-Auto-AT Control Plane}
      ENVIRONMENT: ${ENVIRONMENT:-local}
      PORT: 7000
      OLLAMA_MODEL: ${OLLAMA_MODEL:-ollama:devstral-2}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      DATABASE_URL: postgresql://${POSTGRES_USER:-auto_at}:${POSTGRES_PASSWORD:-local-development-only}@postgres:5432/${POSTGRES_DB:-auto_at}
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-auto-at-artifacts}
      MINIO_SECURE: "false"
      RUNNER_DISPATCH_ENABLED: "false"
      PLAYWRIGHT_WORKER_URL: http://playwright-worker:7100
      ARTIFACT_ROOT: /artifacts
      TEMPORAL_ENABLED: "true"
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: ${TEMPORAL_NAMESPACE:-auto-at-local}
      TEMPORAL_TASK_QUEUE: ${TEMPORAL_TASK_QUEUE:-auto-at-run-dispatch-v1}
      WATCHFILES_FORCE_POLLING: "true"
    ports:
      - "${CONTROL_PLANE_PORT:-7000}:7000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      temporal:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - execution-artifacts:/artifacts
    command: >
      uv run --no-sync uvicorn main:app --app-dir apps/control-plane
      --host 0.0.0.0 --port 7000
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:7000/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  playwright-worker:
    build:
      context: ./workers/playwright
      dockerfile: Dockerfile
    environment:
      ARTIFACT_ROOT: /artifacts
      PORT: 7100
    volumes:
      - execution-artifacts:/artifacts
    expose:
      - "7100"
    restart: unless-stopped

  temporal-worker:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-auto_at}:${POSTGRES_PASSWORD:-local-development-only}@postgres:5432/${POSTGRES_DB:-auto_at}
      PLAYWRIGHT_WORKER_URL: http://playwright-worker:7100
      ARTIFACT_ROOT: /artifacts
      TEMPORAL_ENABLED: "true"
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: ${TEMPORAL_NAMESPACE:-auto-at-local}
      TEMPORAL_TASK_QUEUE: ${TEMPORAL_TASK_QUEUE:-auto-at-run-dispatch-v1}
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_started
      playwright-worker:
        condition: service_started
    volumes:
      - execution-artifacts:/artifacts
    entrypoint: []
    command: uv run --no-sync python -m infrastructure.workflows.temporal_worker
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-auto_at}
      POSTGRES_USER: ${POSTGRES_USER:-auto_at}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  temporal-postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: temporal
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: ${TEMPORAL_POSTGRES_PASSWORD:-temporal-local-development-only}
    volumes:
      - temporal-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  temporal:
    image: temporalio/auto-setup:1.29.7
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: temporal
      POSTGRES_PWD: ${TEMPORAL_POSTGRES_PASSWORD:-temporal-local-development-only}
      POSTGRES_SEEDS: temporal-postgres
      DEFAULT_NAMESPACE: ${TEMPORAL_NAMESPACE:-auto-at-local}
      DEFAULT_NAMESPACE_RETENTION: 1d
    depends_on:
      temporal-postgres:
        condition: service_healthy
    ports:
      - "${TEMPORAL_PORT:-7233}:7233"
    restart: unless-stopped

  temporal-ui:
    image: temporalio/ui:2.40.0
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_UI_PORT: 8080
    depends_on:
      temporal:
        condition: service_started
    ports:
      - "${TEMPORAL_UI_PORT:-8080}:8080"
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-auto-at-artifacts}
    entrypoint: >
      /bin/sh -c "mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
      mc mb --ignore-existing local/$$MINIO_BUCKET"
    restart: "no"

volumes:
  postgres-data:
  temporal-postgres-data:
  redis-data:
  minio-data:
  execution-artifacts:
