services:
  control-plane:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      APP_NAME: ${APP_NAME:-Auto-AT Control Plane}
      ENVIRONMENT: ${ENVIRONMENT:-local}
      PORT: 7000
      OLLAMA_MODEL: ${OLLAMA_MODEL:-ollama:devstral-2}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      DATABASE_URL: postgresql://${POSTGRES_USER:-auto_at}:${POSTGRES_PASSWORD:-local-development-only}@postgres:5432/${POSTGRES_DB:-auto_at}
      REDIS_URL: redis://redis:6379/0
      RUSTFS_ENDPOINT: http://rustfs:9000
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-LOCALRUSTFSADMIN}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-local-rustfs-development-only}
      RUSTFS_BUCKET: ${RUSTFS_BUCKET:-auto-at-artifacts}
      RUSTFS_SECURE: "false"
      RUSTFS_PATH_STYLE: "true"
      RUNNER_DISPATCH_ENABLED: "true"
      PLAYWRIGHT_WORKER_URL: http://playwright-worker:7100
      WORKER_PROGRESS_CALLBACK_SECRET: ${WORKER_PROGRESS_CALLBACK_SECRET:-}
      VISION_WORKER_SECRET: ${VISION_WORKER_SECRET:-}
      ARTIFACT_ROOT: /artifacts
      TEMPORAL_ENABLED: "true"
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: ${TEMPORAL_NAMESPACE:-auto-at-local}
      TEMPORAL_TASK_QUEUE: ${TEMPORAL_TASK_QUEUE:-auto-at-run-dispatch-v1}
      WATCHFILES_FORCE_POLLING: "true"
    ports:
      - "${CONTROL_PLANE_PORT:-7000}:7000"
    depends_on:
      artifact-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rustfs-init:
        condition: service_completed_successfully
      temporal:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - execution-artifacts:/artifacts
    command: >
      uv run --no-sync uvicorn main:app --app-dir apps/control-plane
      --host 0.0.0.0 --port 7000
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:7000/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  dashboard:
    build:
      context: .
      dockerfile: apps/dashboard/Dockerfile
      args:
        NEXT_PUBLIC_CONTROL_PLANE_URL: http://localhost:${CONTROL_PLANE_PORT:-7000}
    environment:
      NEXT_PUBLIC_CONTROL_PLANE_URL: http://localhost:${CONTROL_PLANE_PORT:-7000}
    ports:
      - "${DASHBOARD_PORT:-3000}:3000"
    depends_on:
      control-plane:
        condition: service_healthy
    restart: unless-stopped

  playwright-worker:
    build:
      context: ./workers/playwright
      dockerfile: Dockerfile
    environment:
      ARTIFACT_ROOT: /artifacts
      PORT: 7100
      PROGRESS_CALLBACK_URL: http://control-plane:7000/api/v1/internal/worker-progress
      PROGRESS_CALLBACK_SECRET: ${WORKER_PROGRESS_CALLBACK_SECRET:-}
      VISION_WORKER_SECRET: ${VISION_WORKER_SECRET:-}
    depends_on:
      artifact-init:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=512m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    mem_limit: 1g
    cpus: 1.0
    volumes:
      - execution-artifacts:/artifacts
    expose:
      - "7100"
    restart: unless-stopped

  artifact-init:
    image: busybox:1.37
    command: ["sh", "-c", "mkdir -p /artifacts && chown -R 1001:1001 /artifacts"]
    volumes:
      - execution-artifacts:/artifacts
    restart: "no"

  benchmark-target:
    image: node:22-alpine
    working_dir: /benchmark
    command: node server.mjs
    volumes:
      - ./benchmarks/targets/web-ui:/benchmark:ro
    expose:
      - "7200"
    restart: unless-stopped

  temporal-worker:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-auto_at}:${POSTGRES_PASSWORD:-local-development-only}@postgres:5432/${POSTGRES_DB:-auto_at}
      PLAYWRIGHT_WORKER_URL: http://playwright-worker:7100
      ARTIFACT_ROOT: /artifacts
      RUSTFS_ENDPOINT: http://rustfs:9000
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-LOCALRUSTFSADMIN}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-local-rustfs-development-only}
      RUSTFS_BUCKET: ${RUSTFS_BUCKET:-auto-at-artifacts}
      VISION_WORKER_SECRET: ${VISION_WORKER_SECRET:-}
      TEMPORAL_ENABLED: "true"
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: ${TEMPORAL_NAMESPACE:-auto-at-local}
      TEMPORAL_TASK_QUEUE: ${TEMPORAL_TASK_QUEUE:-auto-at-run-dispatch-v1}
    depends_on:
      artifact-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      temporal:
        condition: service_started
      playwright-worker:
        condition: service_started
      rustfs-init:
        condition: service_completed_successfully
    volumes:
      - execution-artifacts:/artifacts
    entrypoint: []
    command: uv run --no-sync python -m infrastructure.workflows.temporal_worker
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-auto_at}
      POSTGRES_USER: ${POSTGRES_USER:-auto_at}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  temporal-postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: temporal
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: ${TEMPORAL_POSTGRES_PASSWORD:-temporal-local-development-only}
    volumes:
      - temporal-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  temporal:
    image: temporalio/auto-setup:1.29.7
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: temporal
      POSTGRES_PWD: ${TEMPORAL_POSTGRES_PASSWORD:-temporal-local-development-only}
      POSTGRES_SEEDS: temporal-postgres
      DEFAULT_NAMESPACE: ${TEMPORAL_NAMESPACE:-auto-at-local}
      DEFAULT_NAMESPACE_RETENTION: 1d
    depends_on:
      temporal-postgres:
        condition: service_healthy
    ports:
      - "${TEMPORAL_PORT:-7233}:7233"
    restart: unless-stopped

  temporal-ui:
    image: temporalio/ui:2.40.0
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_UI_PORT: 8080
    depends_on:
      temporal:
        condition: service_started
    ports:
      - "${TEMPORAL_UI_PORT:-8080}:8080"
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  rustfs:
    image: rustfs/rustfs:1.0.0-alpha.69
    command: /data
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-LOCALRUSTFSADMIN}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-local-rustfs-development-only}
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
    ports:
      - "${RUSTFS_API_PORT:-9000}:9000"
      - "${RUSTFS_CONSOLE_PORT:-9001}:9001"
    volumes:
      - rustfs-data:/data
    restart: unless-stopped

  rustfs-init:
    image: busybox:1.37
    depends_on:
      rustfs:
        condition: service_started
    entrypoint:
      - sh
      - -c
      - >-
        until wget -q -O /dev/null http://rustfs:9000/health/ready;
        do sleep 2; done
    restart: "no"

  loki:
    build: ./observability/loki
    image: auto-at-loki:local
    command: -config.file=/etc/loki/loki-config.yaml
    volumes:
      - loki-data:/loki
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:3100/ready"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  fluent-bit:
    build: ./observability/fluent-bit
    image: auto-at-fluent-bit:local
    command: ["/fluent-bit/bin/fluent-bit", "-c", "/fluent-bit/etc/fluent-bit.conf", "-R", "/fluent-bit/etc/parsers.conf"]
    depends_on:
      loki:
        condition: service_healthy
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - fluent-bit-buffer:/buffers
    restart: unless-stopped

  grafana:
    build: ./observability/grafana
    image: auto-at-grafana:local
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-local-grafana-development-only}
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    depends_on:
      loki:
        condition: service_healthy
    volumes:
      - grafana-data:/var/lib/grafana
    restart: unless-stopped

volumes:
  postgres-data:
  temporal-postgres-data:
  redis-data:
  rustfs-data:
  execution-artifacts:
  loki-data:
  fluent-bit-buffer:
  grafana-data:
